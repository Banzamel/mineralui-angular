<doc-article
    title="Quick Start"
    description="Your first MineralUI component in Angular, and the conventions every component follows."
>
    <doc-section
        title="Basic example"
        description="Standalone components, constants for icons and illustrations, and the theme service — all signal based."
    >
        <doc-preview [example]="welcomeCard" />
    </doc-section>

    <doc-section
        title="From React to Angular"
        description="MineralUI for Angular keeps the React names (MButton, MDatePicker, MThemeService) but follows Angular idioms instead of copying the React API one to one."
    >
        <m-data-table
            compact
            class="doc-reference-table"
            label="React conventions and their Angular counterparts"
            [columns]="conventionColumns"
            [data]="conventions"
        >
            <ng-template mCell="example" let-value="value"
                ><code mCode>{{ value }}</code></ng-template
            >
        </m-data-table>
    </doc-section>

    <doc-section title="Porting status">
        <p mText>
            The Angular port follows the React library group by group. Available today: theme, i18n, utils, icons and
            illustrations. Components arrive with their documentation pages — the navigation lists only what is ready.
        </p>
    </doc-section>
</doc-article>
