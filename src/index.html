<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>MineralUI for Angular</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Documentation for MineralUI for Angular: components, theming, i18n, icons and illustrations."
        />
        <link rel="icon" type="image/x-icon" href="favicon.ico" />
        <!-- m-theme-init: getMThemeInitScript({defaultMode}) from @banzamel/mineralui-angular/theme, synced by scripts/generate-docs.mjs -->
        <script>(function(){try{var m=null;try{m=localStorage.getItem("mineralui-theme")}catch(e){}if(m!=='dark'&&m!=='light'&&m!=='system')m="system";if(m==='system')m=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';var r=document.documentElement;r.classList.toggle('theme-light',m==='light');r.style.colorScheme=m}catch(e){}})()</script>
        <!-- /m-theme-init -->
    </head>
    <body>
        <doc-root></doc-root>
    </body>
</html>
