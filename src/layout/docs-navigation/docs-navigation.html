<m-sidebar-header>
    <span mText weight="semibold" class="doc-nav-title">{{ activeTitle() }}</span>
</m-sidebar-header>

<m-sidebar-body>
    <div class="doc-nav-search">
        <!-- Filters on every keystroke through [(value)]; the debounced (searched) is not needed here. -->
        <m-input-search
            size="sm"
            clickEffect="none"
            fullWidth
            [ariaLabel]="'ui.searchDocs' | mT"
            [placeholder]="'ui.searchDocs' | mT"
            [(value)]="search"
        />
    </div>

    <nav mSidebarNav aria-label="Documentation">
        @for (section of sections(); track section.category) {
            <!-- Open on a search or for the section of the current page, like docs-react's defaultOpen. -->
            <m-sidebar-group
                [label]="section.category"
                [icon]="sectionIcon(section)"
                [active]="hasActive(section)"
                [open]="searchActive() || hasActive(section)"
                [collapsible]="section.collapsible !== false"
            >
                @for (item of section.items; track item.id) {
                    <a
                        mSidebarItem
                        [routerLink]="['/docs', item.id]"
                        routerLinkActive
                        #rla="routerLinkActive"
                        [active]="rla.isActive"
                        [description]="item.description"
                        >{{ item.title }}</a
                    >
                }
            </m-sidebar-group>
        } @empty {
            <p mText tone="muted" size="sm" class="doc-nav-empty">No pages match this search.</p>
        }
    </nav>
</m-sidebar-body>

<m-sidebar-footer>
    <p mText size="xs" tone="muted" class="doc-nav-footer">
        <m-icon [icon]="copyrightIcon" />
        <a mLink href="https://banzamel.pl" target="_blank" rel="noopener noreferrer" underline="none" tone="inherit"
            >Banzamel</a
        >
        <span>2026</span>
    </p>
</m-sidebar-footer>
