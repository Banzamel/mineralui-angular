<m-stack>
    <m-input-search label="Search available icons" placeholder="Search by export name" fullWidth [(value)]="query" />

    <m-tabs ariaLabel="Icon families" [(value)]="activeTab">
        @for (tab of visible(); track tab.id) {
            <m-tab [value]="tab.id" [label]="tab.label">
                <ng-template mTabContent>
                    <m-stack>
                        @for (group of tab.groups; track group.title) {
                            <section class="doc-stack-sm" [attr.aria-label]="group.title">
                                <h3 mHeading class="doc-group-title">
                                    {{ group.title }} <m-badge size="xs" rounded>{{ group.items.length }}</m-badge>
                                </h3>
                                <p mText tone="muted" size="sm">{{ group.tone }}</p>
                                <ul class="doc-icon-grid">
                                    @for (name of group.items; track name) {
                                        <li>
                                            <button
                                                type="button"
                                                class="doc-icon-card"
                                                [attr.aria-label]="(copied() === name ? 'Copied: ' : 'Copy: ') + name"
                                                (click)="copy(name)"
                                            >
                                                @if (icons().get(name); as icon) {
                                                    <m-icon [icon]="icon" size="lg" [shell]="shell()" />
                                                }
                                                <span class="doc-icon-name">{{
                                                    copied() === name ? 'Copied' : name
                                                }}</span>
                                                @if (newIcons().has(name)) {
                                                    <m-badge color="news" size="xs" rounded>new</m-badge>
                                                }
                                            </button>
                                        </li>
                                    }
                                </ul>
                            </section>
                        } @empty {
                            <m-alert color="info" heading="No icons match this search.">
                                Try a broader query or clear the field.
                            </m-alert>
                        }
                    </m-stack>
                </ng-template>
            </m-tab>
        }
    </m-tabs>
</m-stack>
