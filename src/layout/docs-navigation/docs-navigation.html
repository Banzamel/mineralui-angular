<nav class="doc-nav" aria-label="Documentation">
    <div class="doc-nav-search">
        <!-- Filters on every keystroke through [(value)]; the debounced (searched) is not needed here. -->
        <m-input-search
            size="sm"
            clickEffect="none"
            fullWidth
            [ariaLabel]="'ui.searchDocs' | mT"
            [placeholder]="'ui.searchDocs' | mT"
            [(value)]="search"
        />
    </div>

    @for (section of sections(); track section.category) {
        <details class="doc-nav-group" [open]="searchActive() || section.collapsible !== true || rla.isActive">
            <summary class="doc-nav-category">
                @if (sectionIcon(section); as icon) {
                    <m-icon [icon]="icon" />
                }
                {{ section.category }}
            </summary>
            <ul class="doc-nav-items" routerLinkActive #rla="routerLinkActive">
                @for (item of section.items; track item.id) {
                    <li>
                        <a
                            class="doc-nav-link"
                            [routerLink]="['/docs', item.id]"
                            routerLinkActive="doc-nav-link-active"
                            ariaCurrentWhenActive="page"
                            [attr.title]="item.description"
                            >{{ item.title }}</a
                        >
                    </li>
                }
            </ul>
        </details>
    } @empty {
        <p mText tone="muted" size="sm" class="doc-nav-empty">No pages match this search.</p>
    }
</nav>
