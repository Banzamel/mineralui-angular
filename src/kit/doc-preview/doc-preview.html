<m-tabs class="doc-preview" size="sm" [ariaLabel]="example().title">
    <m-tab
        value="preview"
        class="doc-preview-stage"
        [class.doc-preview-stage-sticky]="sticky()"
        [label]="'ui.preview' | mT"
    >
        <ng-container *ngComponentOutlet="example().component; injector: injector()" />
    </m-tab>
    <m-tab value="code" [label]="'ui.code' | mT">
        <doc-code-block [code]="example().source" language="typescript" [title]="example().title" />
    </m-tab>
</m-tabs>
